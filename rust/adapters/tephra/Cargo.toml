[package]
name = "tephra-adapter"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
libc = "0.2"
bench-core = { path = "../../bench-core" }
bench-testcontainers = { path = "../../testcontainers" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
serde_json = "1"
testcontainers = "0.27"

# tephra-client 0.2.1 (published to crates.io) with the `async` feature: the multiplexing
# AsyncClient this adapter drives. https://github.com/tqwewe/tephra
tephra-client = { version = "0.2.1", features = ["async"] }
