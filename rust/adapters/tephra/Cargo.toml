[package]
name = "tephra-adapter"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
libc = "0.2"
bench-core = { path = "../../bench-core" }
bench-testcontainers = { path = "../../testcontainers" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
serde_json = "1"
testcontainers = "0.27"

# tephra is not published to crates.io; pull the client crate straight from the public repo,
# pinned to a rev for reproducible builds. https://github.com/tqwewe/tephra
tephra-client = { git = "https://github.com/tqwewe/tephra", rev = "b5d2d9642bc891bc14480750719a040029e025d8" }
