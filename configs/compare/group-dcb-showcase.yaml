# SHOWCASE: tephra vs umadb vs axonserver. Trimmed from group-dcb for a few clean, shareable
# graphs (~35 min): real 15s runs, a smooth [1,4,16,64] concurrency curve, and the headline
# level of each dimension. For the exhaustive matrix use group-dcb.yaml instead.
performance:
  name: scale-write
  mode: write
  use_docker: true
  warmup_seconds: 2
  duration_seconds: 15
  samples_per_second: 2
  concurrency: { writers: [1, 4, 16, 64] }
  operations:
    write: { event_size_bytes: 256, concurrency_control: true, append_condition: one_tag_one_type }
  stores: [tephra, umadb, axonserver]
---
performance:
  name: scale-read
  mode: read
  use_docker: true
  warmup_seconds: 2
  duration_seconds: 15
  samples_per_second: 2
  concurrency: { readers: [1, 4, 16, 64] }
  operations:
    write: { event_size_bytes: 256 }
    read: { limit: 10, dcb_query: one_tag_one_type }
  setup: { prepopulate_events: 20000, prepopulate_streams: 2000, tag_scheme: graded }
  stores: [tephra, umadb, axonserver]
---
