# SHAKEOUT (not real numbers): tephra, umadb, kurrentdb, eventsourcingdb, fact, marten.
# One representative of each universal workload shape, tiny corpus, 3s runs — just enough to
# prove every store starts and runs cleanly (~10-15 min). The slowest part is per-run
# container start/stop across 6 stores.
performance:
  name: scale-write
  mode: write
  use_docker: true
  warmup_seconds: 1
  duration_seconds: 3
  samples_per_second: 2
  concurrency: { writers: [1, 16] }
  operations:
    write: { event_size_bytes: 256, concurrency_control: false, append_condition: none }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
---
performance:
  name: scale-read
  mode: read
  use_docker: true
  warmup_seconds: 1
  duration_seconds: 3
  samples_per_second: 2
  concurrency: { readers: [1, 16] }
  operations:
    write: { event_size_bytes: 256 }
    read: { limit: 100, dcb_query: one_tag_one_type }
  setup: { prepopulate_events: 5000, prepopulate_streams: 500 }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
---
performance:
  name: batch-64
  mode: write
  use_docker: true
  warmup_seconds: 1
  duration_seconds: 3
  samples_per_second: 2
  concurrency: { writers: [8] }
  operations:
    write: { event_size_bytes: 256, append_condition: none, batch_size: 64 }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
---
performance:
  name: wp-4096
  mode: write
  use_docker: true
  warmup_seconds: 1
  duration_seconds: 3
  samples_per_second: 2
  concurrency: { writers: [8] }
  operations:
    write: { event_size_bytes: 4096, append_condition: none }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
