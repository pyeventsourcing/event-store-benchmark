# Payload-size sweep (tephra vs umadb). Write docs (wp-*) sweep the appended event size;
# read docs (rp-*) prepopulate at a size and read a fixed 1/100 selectivity. Mirrors
# compare.rs `payload_size` / `read_payload_size`.
performance:
  name: wp-64
  mode: write
  use_docker: true
  warmup_seconds: 2
  duration_seconds: 20
  samples_per_second: 2
  concurrency:
    writers: [16]
  operations:
    write:
      event_size_bytes: 64
      append_condition: none
  stores: [tephra, umadb]
