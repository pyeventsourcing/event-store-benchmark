  samples_per_second: 2
  concurrency: { readers: [8] }
  operations:
    write: { event_size_bytes: 256 }
    read: { limit: 1000000, dcb_query: full_scan }
  setup: { prepopulate_events: 5000, prepopulate_streams: 500, tag_scheme: graded }
  stores: [tephra, umadb, axonserver]
---
performance:
  name: resume-recent
  mode: read
  use_docker: true
  warmup_seconds: 1
  duration_seconds: 3
  samples_per_second: 2
  concurrency: { readers: [8] }
  operations:
    write: { event_size_bytes: 256 }
    read: { limit: 1000000, dcb_query: s100, resume: recent }
  setup: { prepopulate_events: 5000, prepopulate_streams: 500, tag_scheme: graded }
  stores: [tephra, umadb, axonserver]
---
performance:
  name: batch-64
  mode: write
  use_docker: true
  warmup_seconds: 1
  duration_seconds: 3
  samples_per_second: 2
  concurrency: { writers: [8] }
  operations:
    write: { event_size_bytes: 256, append_condition: none, batch_size: 64 }
  stores: [tephra, umadb, axonserver]
