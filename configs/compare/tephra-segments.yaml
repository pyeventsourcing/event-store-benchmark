# DCB group: tephra vs umadb vs axonserver, the three DCB-capable stores in this suite.
#
# Fairness settings baked in here and in the testcontainers, recorded per run in
# run_manifest.json:
#   * docker_memory_limit_mb: 4096 on every doc  -> equal cgroup budget for all three stores.
#   * segment size pinned to 16 MiB for BOTH segmented stores (tephra TEPHRA__SEGMENT__SIZE, axon
#     -Daxoniq.axonserver.event.segment-size) so segment size is a controlled constant and small
#     enough that the sustained-write configs cross several boundaries in 60 s -> rollover cost is
#     actually measured, not hidden by a within-one-segment sprint. axon heap pinned -Xmx2g; umadb
#     is page-based (no segments) and keeps its author-set 2 GB page cache. Set in rust/testcontainers.
#   * Reads are run in TWO regimes: `warm-*` (small corpus that fits in the 4 GB budget, so the
#     data is cache-resident) and `cold-*` (a corpus larger than 4 GB, so the cgroup evicts page
#     cache and reads go out-of-core for every store equally). Never mix the two on one chart.
#   * Writes sweep concurrency AND batch size together, plus a pipelined writeflood, so
#     per-append latency and sustained throughput are separable rather than confounded.
#
# 8 vCPU box, client + server co-located (disclosed in the manifest); concurrency capped at 128.

# ============================================================================================
# WRITES
# ============================================================================================

# Headline scaling curve: one conditional (DCB optimistic-concurrency) append per event, batch 1.
performance:
  name: scale-write
  mode: write
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { writers: [1, 4, 16, 64, 128] }
  operations:
    write: { event_size_bytes: 256, concurrency_control: true, append_condition: one_tag_one_type, batch_size: 1 }
  stores: [tephra]
---
# Concurrency x batch matrix (batch 64): separates latency from throughput at a mid batch size.
performance:
  name: matrix-b64
  mode: write
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { writers: [1, 16, 64] }
  operations:
    write: { event_size_bytes: 256, concurrency_control: true, append_condition: one_tag_one_type, batch_size: 64 }
  stores: [tephra]
---
# Concurrency x batch matrix (batch 512): shows large-batch behaviour is concurrency dependent
# (a large synchronous batch at low concurrency is latency-bound, not a store ceiling).
performance:
  name: matrix-b512
  mode: write
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { writers: [1, 16, 64] }
  operations:
    write: { event_size_bytes: 256, concurrency_control: true, append_condition: one_tag_one_type, batch_size: 512 }
  stores: [tephra]
---
# Write flood: pipelined fire-hose, many appends in flight per worker (unconditional). Peak
# sustained ingest, the ceiling test.
performance:
  name: writeflood
  mode: writeflood
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { writers: [16, 64] }
  operations:
    write: { event_size_bytes: 256, in_flight_limit: 256, batch_size: 1 }
  stores: [tephra]
---
# Write payload sweep at fixed 16 writers (conditional), to isolate payload-size effects.
performance:
  name: wp-64
  mode: write
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { writers: [16] }
  operations:
    write: { event_size_bytes: 64, concurrency_control: true, append_condition: one_tag_one_type }
  stores: [tephra]
---
performance:
  name: wp-1024
  mode: write
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { writers: [16] }
  operations:
    write: { event_size_bytes: 1024, concurrency_control: true, append_condition: one_tag_one_type }
  stores: [tephra]
---
performance:
  name: wp-16384
  mode: write
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
