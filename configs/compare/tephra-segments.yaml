# ============================================================================================
# READS - WARM regime (50k-event corpus, cache-resident within the 4 GB budget)
# ============================================================================================

# Scaling curve: load-one-entity read, sweeping readers.
performance:
  name: warm-scale-read
  mode: read
  use_docker: true
  docker_memory_limit_mb: 4096
