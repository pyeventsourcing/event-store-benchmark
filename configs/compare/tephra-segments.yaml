# ============================================================================================
# READS - COLD regime (~8 GB corpus > 4 GB budget -> out-of-core for every store)
# 1 KiB payload x 8M events ~= 8 GB, re-seeded per run with 16 parallel seeders. Both shapes are
# BOUNDED on the client side (small `limit`) and SCATTERED across the corpus so each read lands in
# a different, uncached region -> the store must fetch cold pages from disk, while the benchmark
# client never materialises more than a few MB per op. (An unbounded full scan would instead force
# the *client* to hold the whole 8 GB corpus in RAM -> client-side OOM, measuring nothing about the
# store; that is deliberately avoided here.)
# ============================================================================================
# Cold aggregate load: fetch one random entity's events per op. The store must locate and read that
# entity out of the 8 GB on-disk log -> the realistic "rebuild one aggregate from cold storage" op.
performance:
  name: cold-entity
  mode: read
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { readers: [16] }
  operations:
    write: { event_size_bytes: 1024 }
    read: { limit: 10, dcb_query: one_tag_one_type }
  setup: { prepopulate_events: 8000000, prepopulate_streams: 8000, tag_scheme: graded, prepopulate_concurrency: 16 }
  stores: [tephra]
---
# Cold sequential window: read a bounded ~10k-event window (~10 MiB) starting at a fresh random
# global position each op (resume: random). Successive reads hit different cold regions of the log
# -> out-of-core sequential scan throughput, with client memory bounded to ~10 MiB/op x 16 readers.
performance:
  name: cold-window
  mode: read
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { readers: [16] }
  operations:
    write: { event_size_bytes: 1024 }
    read: { limit: 10000, dcb_query: full_scan, resume: random }
  setup: { prepopulate_events: 8000000, prepopulate_streams: 8000, tag_scheme: graded, prepopulate_concurrency: 16 }
  stores: [tephra]
