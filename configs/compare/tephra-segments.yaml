  duration_seconds: 60
  samples_per_second: 2
  concurrency: { readers: [1, 4, 16, 64, 128] }
  operations:
    write: { event_size_bytes: 256 }
    read: { limit: 10, dcb_query: one_tag_one_type }
  setup: { prepopulate_events: 50000, prepopulate_streams: 5000, tag_scheme: graded }
  stores: [tephra]
---
