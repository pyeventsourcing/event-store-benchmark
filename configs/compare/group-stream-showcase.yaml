# SHOWCASE: tephra, umadb, kurrentdb, eventsourcingdb, fact, marten. Trimmed universal
# benchmarks for a few clean, shareable graphs (~50 min; the six stores' per-run container
# starts are the long pole). For the exhaustive matrix use group-stream.yaml.
performance:
  name: scale-write
  mode: write
  use_docker: true
  warmup_seconds: 2
  duration_seconds: 15
  samples_per_second: 2
  concurrency: { writers: [1, 4, 16, 64] }
  operations:
    write: { event_size_bytes: 256, concurrency_control: false, append_condition: none }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
---
performance:
  name: scale-read
  mode: read
  use_docker: true
  warmup_seconds: 2
  duration_seconds: 15
  samples_per_second: 2
  concurrency: { readers: [1, 4, 16, 64] }
  operations:
    write: { event_size_bytes: 256 }
    read: { limit: 100, dcb_query: one_tag_one_type }
  setup: { prepopulate_events: 20000, prepopulate_streams: 2000 }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
---
performance:
  name: batch-1
  mode: write
  use_docker: true
  warmup_seconds: 2
  duration_seconds: 15
  samples_per_second: 2
  concurrency: { writers: [16] }
  operations:
    write: { event_size_bytes: 256, append_condition: none, batch_size: 1 }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
