# Write flood: pipelined fire-hose (peak sustained ingest). Note the harness special-cases
# Marten under flood (stream_len=1) to keep it from erroring; disclose that on any flood chart.
performance:
  name: writeflood
  mode: writeflood
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { writers: [16, 64] }
  operations:
    write: { event_size_bytes: 256, in_flight_limit: 256, batch_size: 1 }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
