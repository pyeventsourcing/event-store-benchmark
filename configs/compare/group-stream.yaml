# Stream/universal group: benchmarks every store can do fairly (no DCB tag queries).
# Stores: tephra + umadb (as reference) vs the stream stores kurrentdb, eventsourcingdb,
# fact, postgres-dcb-marten. Writes are UNCONDITIONAL single-stream appends (append_condition:
# none) and reads are load-one-entity; this is the raw append/read path all six share.
#
# Fairness caveats to state next to any chart from this file:
#   * Unconditional path: stores give different durability/ordering guarantees here (Marten is a
#     bare INSERT with no reliably-followable sequence; eventsourcingdb commits per write). This
#     is "raw append across the ecosystem", NOT a like-for-like consistency comparison.
#   * docker_memory_limit_mb: 4096 on every doc (equal budget); segment/cache/heap pinned in the
#     testcontainers and recorded in run_manifest.json.
#   * Reads: `warm-*` (cache-resident) always; `cold-*` (out-of-core) only for the fast-writing
#     stores, because eventsourcingdb/fact/marten cannot seed a multi-GB corpus in bounded time.

# ============================================================================================
# WRITES (unconditional)
# ============================================================================================
performance:
  name: scale-write
  mode: write
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { writers: [1, 4, 16, 64, 128] }
  operations:
    write: { event_size_bytes: 256, append_condition: none, batch_size: 1 }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
