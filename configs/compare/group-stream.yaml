---
# ============================================================================================
# READS - WARM (load one entity; 50k corpus, seeded with 8 parallel seeders so the slow-writing
# stores seed in bounded time)
# ============================================================================================
performance:
  name: warm-scale-read
  mode: read
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { readers: [1, 4, 16, 64, 128] }
  operations:
    write: { event_size_bytes: 256 }
    read: { limit: 10, dcb_query: one_tag_one_type }
  setup: { prepopulate_events: 50000, prepopulate_streams: 5000, prepopulate_concurrency: 8 }
  stores: [tephra, umadb, kurrentdb, eventsourcingdb, fact, postgres-dcb-marten]
---
# ============================================================================================
# READS - COLD (out-of-core point read; ~8 GB corpus > 4 GB budget). Fast-writing stores only:
# eventsourcingdb/fact/marten cannot seed 8M events in bounded time.
# ============================================================================================
performance:
  name: cold-scale-read
  mode: read
  use_docker: true
  docker_memory_limit_mb: 4096
  warmup_seconds: 15
  duration_seconds: 60
  samples_per_second: 2
  concurrency: { readers: [16] }
  operations:
    write: { event_size_bytes: 1024 }
    read: { limit: 10, dcb_query: one_tag_one_type }
  setup: { prepopulate_events: 8000000, prepopulate_streams: 8000, prepopulate_concurrency: 16 }
  stores: [tephra, umadb, kurrentdb]
