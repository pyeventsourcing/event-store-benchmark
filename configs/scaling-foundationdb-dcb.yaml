performance:
  name: warmup-write-one-tag-one-type
  mode: write
#  use_docker: true
  warmup_seconds: 0
  duration_seconds: 3
  samples_per_second: 2
  concurrency:
    writers: [1]
  operations:
    write:
      event_size_bytes: 256
      concurrency_control: true
      append_condition: one_tag_one_type

  stores:
    - foundationdb-dcb
---
performance:
  name: warmup-read-one-tag-one-type
  mode: read
#  use_docker: true
  warmup_seconds: 1
  duration_seconds: 3
  samples_per_second: 2
  concurrency:
    readers: [4]
  operations:
    write:
      event_size_bytes: 256
    read:
      dcb_query: one_tag_one_type
  setup:
    prepopulate_events: 500
    prepopulate_streams: 50
  stores:
    - foundationdb-dcb
---
performance:
  name: write-one-tag-one-type
  mode: write
#  use_docker: true
  warmup_seconds: 1
  duration_seconds: 30
  samples_per_second: 2
  concurrency:
#    writers: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    writers: [1, 2, 4, 8, 16]
  operations:
    write:
      event_size_bytes: 256
      concurrency_control: true
      append_condition: one_tag_one_type

  stores:
    - foundationdb-dcb
---
performance:
  name: read-one-tag-one-type
  mode: read
#  use_docker: true
  warmup_seconds: 1
  duration_seconds: 30
  samples_per_second: 2
  concurrency:
#    readers: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    readers: [1, 2, 4, 8, 16]
  operations:
    write:
      event_size_bytes: 256
    read:
      dcb_query: one_tag_one_type
      limit: 10
  setup:
    prepopulate_events: 500
    prepopulate_streams: 50

  stores:
    - foundationdb-dcb
