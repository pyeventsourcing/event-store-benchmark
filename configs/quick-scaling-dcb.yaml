performance:
  name: write-one-tag-one-type
  mode: write
  warmup_seconds: 0
  duration_seconds: 2
  samples_per_second: 2
  concurrency:
    writers: [2]
  operations:
    write:
      event_size_bytes: 256
      concurrency_control: true
      append_condition: one_tag_one_type

  stores:
    - umadb
    - axonserver
    - postgres-dcb-ttcte
    - foundationdb-dcb
---
performance:
  name: read-one-tag-one-type
  mode: read
  warmup_seconds: 0
  duration_seconds: 2
  samples_per_second: 2
  concurrency:
    readers: [2]
  operations:
    write:
      event_size_bytes: 256
    read:
      dcb_query: one_tag_one_type
      limit: 10
  setup:
    prepopulate_events: 500
    prepopulate_streams: 50

  stores:
    - umadb
    - axonserver
    - postgres-dcb-ttcte
    - foundationdb-dcb
---
performance:
  name: subscribe-all
  mode: subscribe
  warmup_seconds: 0
  duration_seconds: 2
  samples_per_second: 2
  concurrency:
    readers: [2]
    writers: 1
  operations:
    write:
      event_size_bytes: 256
  stores:
    - umadb
    - axonserver
    - postgres-dcb-ttcte
    - foundationdb-dcb
