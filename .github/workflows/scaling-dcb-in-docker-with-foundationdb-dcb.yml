name: Scaling DCB In Docker (Including FoundationDB-DCB)

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main
#  pull_request:
#    branches:
#      - main

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      session_id: ${{ steps.session.outputs.session_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate Session ID
        id: session
        run: echo "session_id=$(date +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install FoundationDB Client
        run: |
          # 1. Download the client packages
          wget https://github.com/apple/foundationdb/releases/download/7.4.5/foundationdb-clients_7.4.5-1_amd64.deb
          
          # 2. Install the client
          sudo dpkg -i foundationdb-clients_7.4.5-1_amd64.deb

      - name: Build benchmark tool
        run: make build

      - name: Upload benchmark tool
        uses: actions/upload-artifact@v6
        with:
          name: es-bench
          path: target/release/es-bench
          retention-days: 1

      - name: Upload configs
        uses: actions/upload-artifact@v6
        with:
          name: configs
          path: configs/
          retention-days: 1

      - name: Upload Makefile
        uses: actions/upload-artifact@v6
        with:
          name: Makefile
          path: Makefile
          retention-days: 1

  run-scaling-dcb:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
#        Exclude postgres-dcb-ttcte for now, because I'm not sure it runs in Docker?
#        store: [umadb, axonserver, postgres-dcb-ttcte, foundationdb-dcb]
        store: [umadb, axonserver, foundationdb-dcb]
    env:
      ESB_SESSION_ID: ${{ needs.setup.outputs.session_id }}
      ESB_WORKLOAD_STORES: ${{ matrix.store }}
      ESB_GIT_VERSION: ${{ github.sha }}
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      ESB_MAX_CONCURRENT_WORKERS: 128  # low number because foundationdb-dcb tends to hang for some reason
      ESB_USE_DOCKER: true  # New environment variable, which should make some workload configs redundant?
    steps:
      - name: Download Makefile
        uses: actions/download-artifact@v8
        with:
          name: Makefile
          path: .

      - name: Download benchmark tool
        uses: actions/download-artifact@v8
        with:
          name: es-bench
          path: target/release/

      - name: Download configs
        uses: actions/download-artifact@v8
        with:
          name: configs
          path: configs/

      - name: Make benchmark tool executable
        run: chmod +x target/release/es-bench

      - name: Install FoundationDB Client (libfdb_c.so is needed by the benchmark tool)
        run: |
          # 1. Download the client packages
          wget https://github.com/apple/foundationdb/releases/download/7.4.5/foundationdb-clients_7.4.5-1_amd64.deb
          
          # 2. Install the client
          sudo dpkg -i foundationdb-clients_7.4.5-1_amd64.deb

#      - name: Start Postgres
#        if: ${{ matrix.store == 'postgres-dcb-ttcte' }}
#        run: |
#          sudo apt-get update
#          sudo apt-get install -y postgresql postgresql-contrib
#          sudo mkdir -p /etc/systemd/system/postgresql.service.d
#          sudo tee /etc/systemd/system/postgresql.service.d/override.conf >/dev/null <<'EOF'
#          [Service]
#          CPUAffinity=0 1 2
#          EOF
#          sudo systemctl daemon-reload
#          sudo systemctl restart postgresql
#          sudo systemctl status postgresql
#          systemctl show postgresql -p CPUAffinity
#
#          pgrep -x postgres | xargs -I{} taskset -cp {}
#
#          sudo -u postgres psql -c 'CREATE DATABASE eventsourcing;'
#          sudo -u postgres psql -c "CREATE USER eventsourcing WITH PASSWORD 'eventsourcing';"
#          sudo -u postgres psql -c "ALTER DATABASE eventsourcing OWNER TO eventsourcing;"
#
#          sudo -u postgres psql -tAc "SHOW max_connections;"
#          sudo -u postgres psql -tAc "SHOW superuser_reserved_connections;"
#          sudo -u postgres psql -tAc "SELECT current_setting('max_connections')::int - current_setting('superuser_reserved_connections')::int AS usable_non_superuser_slots;"
#
#      - name: Create tables for PyEventsourcing
#        if: ${{ matrix.store == 'postgres-dcb-ttcte' }}
#        run: |
#          pgrep -o -x postgres > $GITHUB_WORKSPACE/postgres-dcb-ttcte.pid
#          ./target/release/es-bench create-py-eventsourcing-tables

      - name: Run scaling DCB workload
        run: |
          taskset -c 3 make run-scaling-dcb

      - name: Upload scaling results
        uses: actions/upload-artifact@v6
        with:
          name: results-scaling-${{ matrix.store }}
          path: results/
          retention-days: 1

  report:
    needs: [setup, run-scaling-dcb]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Create Python virtual environment for reporting
        run: make venv

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results/
          merge-multiple: true

      - name: Generate report
        run: make report

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-report
          path: results/
